# pnpm 11 reads package-level settings from here rather than package.json.
# Allow only these trusted native-addon packages to run install/build scripts.
allowBuilds:
  '@node-rs/argon2': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # The local reranker (spec 0036). Its CPU binaries ship in the package; the
  # postinstall only fetches optional CUDA/TensorRT providers, which the app
  # never loads.
  onnxruntime-node: false

# Security floors for transitive dependencies that the direct ones have not
# picked up yet (#11). Remove an entry once `pnpm why <pkg>` shows every path
# already resolving above it.
overrides:
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
