# pnpm 11 reads package-level settings from here rather than package.json.
# Allow only these trusted native-addon packages to run install/build scripts.
allowBuilds:
  '@node-rs/argon2': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # The local reranker (spec 0036). Its CPU binaries ship in the package; the
  # postinstall only fetches optional CUDA/TensorRT providers, which the app
  # never loads.
  onnxruntime-node: false

# Security floors for transitive dependencies that the direct ones have not
# picked up yet (#11). Remove an entry once `pnpm why <pkg>` shows every path
# already resolving above it.
overrides:
  browserslist: '>=4.28.7'
  baseline-browser-mapping: '>=2.11.0'
  # mermaid > chevrotain pins 4.17.23: template code injection and prototype
  # pollution advisories (#129).
  lodash-es: '>=4.17.24'
  # next 16.4.6 depends on postcss 8.5.23, which allows source-map-js ^1.2.1.
  # 1.2.1 is the event-loop DoS advisory; no newer Next selects 1.2.2 (#181).
  source-map-js: '>=1.2.2'
  # Dev and build tooling only (eslint, commitlint, vitest, tailwind's
  # postcss): each floor stays inside the major its parent asked for.
  'brace-expansion@<1.1.20': '^1.1.20'
  'brace-expansion@>=4.0.0 <5.0.11': '^5.0.11'
  'fast-uri@>=3.0.0 <3.1.7': '^3.1.7'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'nanoid@<3.3.18': '^3.3.18'
  'postcss@>=8.0.0 <8.5.18': '^8.5.18'
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'zod@<4.6.6': '^4.6.6'
  # drizzle-kit still loads its config through @esbuild-kit, which pins
  # esbuild 0.18 (dev-server advisory); typescript-estree allows minimatch 10.
  '@esbuild-kit/core-utils>esbuild': '^0.25.4'
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'
